services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lexiplay
      POSTGRES_USER: lexiplay
      POSTGRES_PASSWORD: lexiplay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiplay -d lexiplay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
