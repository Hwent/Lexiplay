<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a14" />
    <style>
      html { color-scheme: dark; background: #141a14; }
      html[data-theme="light"] { color-scheme: light; background: #f5f6f3; }
    </style>
    <script>
      try {
        if (localStorage.getItem('lexiplay-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f5f6f3';
        }
      } catch {}
    </script>
    <title>LexiPlay — Learn new words</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
