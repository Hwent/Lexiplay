name: Deploy LexiPlay to Azure

on:
  push:
    branches: [Nov-2026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexiplay-canada-central
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/Nov-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package tracked source files
        run: git archive --format=zip --output="$RUNNER_TEMP/lexiplay-source.zip" HEAD

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9D65272DD4314EA7B7444C45852708EF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0A5184B4E8743EDAC88EA2EA1F7D7DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8559F37E38344DF88E515888A663C33B }}

      - name: Deploy source for the configured pnpm build
        uses: azure/webapps-deploy@v3
        with:
          app-name: lexiplay-ca-api-20261104
          package: ${{ runner.temp }}/lexiplay-source.zip

      - name: Verify deployed API health
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 10 --max-time 15
          --retry 24 --retry-delay 10 --retry-max-time 300 --retry-all-errors
          https://lexiplay-ca-api-20261104-drhmefb7d4dafee7.canadacentral-01.azurewebsites.net/api/v1/health
