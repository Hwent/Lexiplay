name: Deploy LexiPlay to Azure

on:
  push:
    branches: [Nov-2026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexiplay-canada-central
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/Nov-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package tracked source files
        run: git archive --format=zip --output="$RUNNER_TEMP/lexiplay-source.zip" HEAD

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy source for the configured pnpm build
        uses: azure/webapps-deploy@v3
        with:
          app-name: lexiplay-ca-api-20261104
          package: ${{ runner.temp }}/lexiplay-source.zip
